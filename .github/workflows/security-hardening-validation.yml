name: Security Hardening Validation

on:
  push:
    branches:
      - security/compensating-auth-controls
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run excellence:check
      - run: npm run build
