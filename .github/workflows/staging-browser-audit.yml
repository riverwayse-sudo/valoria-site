name: Staging browser screenshots and UX audit

on:
  # Full browser audits run after the isolated staging deploy; manual dispatch remains available.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out audit script
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright without changing project dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture staging screenshots and verify UX safeguards
        run: node scripts/staging-browser-audit.mjs

      - name: Upload screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-staging-browser-audit
          path: artifacts/staging-browser-audit/
          if-no-files-found: warn
          retention-days: 7
