name: Site quality gates

on:
  pull_request:
    branches: [main, 'experience/staging-redesign-20261106']
  push:
    branches: [main, 'experience/staging-redesign-20261106']

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run contract and unit tests
        run: npm test -- --runInBand
      - name: Run opportunity validation tests
        run: npm run test:opportunity-validation
      - name: Check design system
        run: npm run design:check
      - name: Check implementation quality
        run: npm run excellence:check
