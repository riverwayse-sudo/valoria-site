name: Browser Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-quality:
    name: Browser and Accessibility Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_key
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
      ANTHROPIC_API_KEY: placeholder_anthropic_key
      ANTHROPIC_CHAT_MODEL: claude-sonnet-4-6
      BREVO_API_KEY: placeholder_brevo_key
      SUPPORT_NOTIFICATION_EMAIL: info@valoriainstitute.com
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install project dependencies
        run: npm ci
      - name: Install pinned browser test tools without changing the lockfile
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Build production application
        run: npm run build
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser, runtime, and accessibility tests
        run: npx playwright test
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-browser-quality-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
