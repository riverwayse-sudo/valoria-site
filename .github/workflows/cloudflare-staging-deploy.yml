name: Deploy Valoria site to isolated Cloudflare staging
# Final verification: test canonical ATB IDs, consent-gated public data and premium profile preview.

on:
  pull_request:
    branches: ["experience/staging-redesign-20261106"]
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "next.config.js"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-staging-deploy.yml"
  push:
    branches: ["experience/staging-redesign-20261106"]
    paths:
      - "src/**"
      - "next.config.js"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valoria-site-cloudflare-staging-final
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'deploy/staging-')) }}
    name: Build and deploy isolated staging Worker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run Jest contract tests
        run: npm test -- --runInBand
      - name: Run opportunity validation tests
        run: npm run test:opportunity-validation
      - name: Provide CI-only build configuration
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_C3j_CjLgTLDGRu8rH1SXEg_tYpxoYUm
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          ANTHROPIC_API_KEY=placeholder-anthropic-key
          VALU_UPSTREAM_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          VALU_PREVIEW_ASSESSMENT_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          NEXT_PUBLIC_VALU_ASSESSMENT_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          CF_WORKERS_PREVIEW=1
          VALU_PREVIEW=1
          NEXT_PUBLIC_VALU_PREVIEW=1
          VALU_STAGING_API_ENABLED=1
          NEXT_PUBLIC_VALU_STAGING_API_ENABLED=1
          EOF
      - name: Install pinned Cloudflare build tools
        run: npm install --no-save @opennextjs/cloudflare@1.20.15 wrangler@4.156.1
      - name: Build OpenNext output
        run: npx @opennextjs/cloudflare build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Deploy only the staging Worker
        run: npx wrangler deploy --config wrangler.jsonc --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test staging routes and SEO endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://valoria-staging-site.riverwayse.workers.dev"
          routes=(
            /
            /valu
            /valu/start
            /valu/assessment
            /prime
            /about-us
            /atb-connect
            /atb-spotlight
            /develop
            /programmes
            /facilitators
            /careers
            /contact-us
            /login
            /professional-signup
            /dashboard
            /marketplace
            /marketplace/talent
            /marketplace/speakers
            /marketplace/facilitators
            /jobs
            /opportunities
            /opportunities/submit
            /events
            /privacy
            /terms
            /privacypolicy
            /terms-of-use
            /knowledge
            /knowledge/valu-index
            /knowledge/prime-framework
            /knowledge/professional-capability
            /robots.txt
            /sitemap.xml
            /llms.txt
          )
          for route in "${routes[@]}"; do
            status="$(curl -sSL --retry 4 --retry-all-errors --max-time 25 -o /tmp/valoria-route-response -w '%{http_code}' "$base$route" || true)"
            if [[ "$status" != "200" ]]; then
              echo "Route $route returned HTTP $status"
              cat /tmp/valoria-route-response || true
              exit 1
            fi
          done
          echo "PASS: public route smoke"

          # This must reach the Worker handler (405), not fall through to an HTML asset or 404.
          assessment_html="$(curl -fsSL --max-time 30 "$base/valu/assessment/")"
          grep -qi 'Valoria Platform' <<<"$assessment_html"
          grep -qi 'id="root"' <<<"$assessment_html"
          grep -Eqi '<script[^>]+src=' <<<"$assessment_html"

          assessment_api_status="$(curl -sS --max-time 25 -o /tmp/valu-assessment-api-response -w '%{http_code}' "$base/valu/assessment/api/taster-progress")"
          if [[ "$assessment_api_status" != "405" ]]; then
            echo "Assessment API proxy returned HTTP $assessment_api_status; expected 405 for GET."
            cat /tmp/valu-assessment-api-response || true
            exit 1
          fi
          grep -qi 'Method not allowed' /tmp/valu-assessment-api-response
          assessment_options_status="$(curl -sS --max-time 25 -X OPTIONS -H "Origin: $base" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' -o /tmp/valu-assessment-options-response -w '%{http_code}' "$base/valu/assessment/api/taster-progress")"
          if [[ "$assessment_options_status" != "204" ]]; then
            echo "Assessment API OPTIONS proxy returned HTTP $assessment_options_status; expected 204."
            cat /tmp/valu-assessment-options-response || true
            exit 1
          fi
          echo "PASS: assessment shell and API proxy"


          curl -fsS "$base/robots.txt" -o /tmp/valoria-robots.txt
          grep -Eq '^Disallow: /$' /tmp/valoria-robots.txt

          curl -fsS "$base/sitemap.xml" -o /tmp/valoria-sitemap.xml
          grep -q 'staging.valoriainstitute.com' /tmp/valoria-sitemap.xml
          grep -q '/knowledge/prime-framework' /tmp/valoria-sitemap.xml
          grep -q '/jobs' /tmp/valoria-sitemap.xml
          echo "PASS: robots and sitemap"

          curl -fsS "$base/llms.txt" -o /tmp/valoria-llms.txt
          grep -q 'Human-AI Collaboration' /tmp/valoria-llms.txt
          grep -q 'Basic is a marketplace access state, not a merit tier' /tmp/valoria-llms.txt

          curl -fsS "$base/" -o /tmp/valoria-home.html
          grep -q 'Capability should decide' /tmp/valoria-home.html
          grep -q 'THREE WAYS TO ENGAGE' /tmp/valoria-home.html
          grep -q 'INITIAL MARKET' /tmp/valoria-home.html
          grep -q 'Valoria is Africa-first' /tmp/valoria-home.html

          : > /tmp/valoria-css-bundle.css
          css_assets="$(grep -oE 'href="[^"]+\.css[^"]*"' /tmp/valoria-home.html | cut -d '"' -f 2)"
          if [[ -z "$css_assets" ]]; then
            echo "No compiled CSS assets found in homepage HTML"
            exit 1
          fi
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            if [[ "$asset" =~ ^https?:// ]]; then
              css_url="$asset"
            else
              css_url="$base$asset"
            fi
            curl -fsSL --retry 4 --retry-all-errors --max-time 25 "$css_url" >> /tmp/valoria-css-bundle.css
          done <<< "$css_assets"
          grep -Fq '.vi-nav .nav-dropdown' /tmp/valoria-css-bundle.css
          grep -Fq '.nav-mobile .nav-dropdown' /tmp/valoria-css-bundle.css
          grep -Fq 'text-align:left!important' /tmp/valoria-css-bundle.css
          echo "PASS: compiled left-alignment CSS"

          # The two identity/handoff APIs must pass the preview middleware and
          # reject unauthenticated calls themselves; all other site APIs stay disabled.
          status="$(curl -sS -o /tmp/valu-handoff-noauth -w '%{http_code}' "$base/api/valu-handoff")"
          if [[ "$status" != "401" ]]; then
            echo "Unauthenticated VALU handoff returned HTTP $status (expected 401)"
            cat /tmp/valu-handoff-noauth || true
            exit 1
          fi
          status="$(curl -sS -o /tmp/valu-link-taster-noauth -w '%{http_code}' -X POST "$base/api/link-taster" -H 'Content-Type: application/json' -d '{}')"
          if [[ "$status" != "401" ]]; then
            echo "Unauthenticated taster link returned HTTP $status (expected 401)"
            cat /tmp/valu-link-taster-noauth || true
            exit 1
          fi
          echo "PASS: unauthenticated handoff guards"
          status="$(curl -sS -o /tmp/valu-opportunities-disabled -w '%{http_code}' "$base/api/opportunities")"
          if [[ "$status" != "503" ]]; then
            echo "Staging opportunity API returned HTTP $status (expected 503)"
            cat /tmp/valu-opportunities-disabled || true
            exit 1
          fi
          echo "PASS: staging opportunity API remains disabled"
