name: Validate and deploy current-site audit to isolated Cloudflare staging

on:
  push:
    branches:
      - deploy/staging-current-site-audit-final-20261111
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "scripts/**"
      - ".github/workflows/cloudflare-current-site-staging.yml"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: valoria-site-staging-environment
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Test, build, deploy and smoke-test isolated staging Worker
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run unit and contract tests
        run: npm test -- --runInBand
      - name: Provide staging-only build configuration
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          NEXT_PUBLIC_SITE_URL=https://valoria-staging-site.riverwayse.workers.dev
          NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_C3j_CjLgTLDGRu8rH1SXEg_tYpxoYUm
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          ANTHROPIC_API_KEY=placeholder-anthropic-key
          VALU_ASSESSMENT_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          VALU_UPSTREAM_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          VALU_PREVIEW_ASSESSMENT_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          NEXT_PUBLIC_VALU_ASSESSMENT_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          CF_WORKERS_PREVIEW=1
          VALU_PREVIEW=1
          NEXT_PUBLIC_VALU_PREVIEW=1
          VALU_STAGING_API_ENABLED=1
          NEXT_PUBLIC_VALU_STAGING_API_ENABLED=1
          EOF
      - name: Install pinned Cloudflare build tools
        run: npm install --no-save @opennextjs/cloudflare@1.20.15 wrangler@4.156.1
      - name: Build OpenNext output
        run: npx @opennextjs/cloudflare build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Deploy only the isolated staging Worker
        run: npx wrangler deploy --config wrangler.jsonc --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test staging routes and privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://valoria-staging-site.riverwayse.workers.dev"
          routes=(
            /
            /valu
            /valu/start
            /valu/assessment
            /prime
            /about-us
            /atb-connect
            /atb-spotlight
            /develop
            /careers
            /contact-us
            /login
            /professional-signup
            /dashboard
            /marketplace
            /marketplace/talent
            /marketplace/speakers
            /marketplace/facilitators
            /events
            /privacypolicy
            /terms-of-use
            /robots.txt
            /sitemap.xml
          )
          for route in "${routes[@]}"; do
            status="$(curl -sSL --retry 4 --retry-all-errors --max-time 25 -o /tmp/valoria-route-response -w '%{http_code}' "$base$route" || true)"
            if [[ "$status" != "200" ]]; then
              echo "Route $route returned HTTP $status"
              cat /tmp/valoria-route-response || true
              exit 1
            fi
          done

          curl -fsS "$base/robots.txt" -o /tmp/valoria-robots.txt
          grep -Eq '^Disallow: /$' /tmp/valoria-robots.txt
          curl -fsS "$base/sitemap.xml" -o /tmp/valoria-sitemap.xml
          grep -q 'staging.valoriainstitute.com' /tmp/valoria-sitemap.xml
          curl -fsS "$base/" -o /tmp/valoria-home.html
          grep -q 'START THE VALU INDEX TASTER' /tmp/valoria-home.html
          grep -q 'What brings you' /tmp/valoria-home.html
          grep -q 'Build a stronger professional presence' /tmp/valoria-home.html
          if grep -Eiq '(WANT TO BE DISCOVERED|Build a professional profile that helps relevant buyers|buyer access|sourcing access|BASIC LISTING|FULL LISTING|1 of 58|1 of 9|54 scored questions|four validity checks|nine questions|58 questions)' /tmp/valoria-home.html; then
            echo "Homepage exposes internal access or assessment mechanics"
            exit 1
          fi

          echo "Probing unauthenticated assessment progress endpoint"
          set +e
          status="$(curl --http1.1 -v --connect-timeout 3 --max-time 6 -o /tmp/assessment-api-noauth -w '%{http_code}' -X POST "$base/valu/assessment/api/taster-progress" -H 'Origin: https://valoria-staging-site.riverwayse.workers.dev' -H 'Content-Type: application/json' -d '{"action":"load","resume_token":"invalid"}' 2>/tmp/assessment-api-curl.log)"
          curl_exit=$?
          set -e
          echo "Assessment progress probe curl exit: $curl_exit; HTTP status: ${status:-empty}"
          cat /tmp/assessment-api-curl.log || true
          [[ "$curl_exit" == "0" && "$status" == "401" ]] || { echo "Staging assessment proxy did not return the expected unauthenticated 401"; cat /tmp/assessment-api-noauth || true; exit 1; }

          echo "Probing unauthenticated VALU handoff endpoint"
          status="$(curl --http1.1 -sS --connect-timeout 5 --max-time 10 -o /tmp/valu-handoff-noauth -w '%{http_code}' "$base/api/valu-handoff" || true)"
          echo "VALU handoff probe HTTP status: ${status:-empty}"
          [[ "$status" == "401" ]] || { echo "Unauthenticated VALU handoff returned HTTP $status"; cat /tmp/valu-handoff-noauth || true; exit 1; }
          status="$(curl -sS -o /tmp/valu-link-taster-noauth -w '%{http_code}' -X POST "$base/api/link-taster" -H 'Content-Type: application/json' -d '{"taster_id":"00000000-0000-0000-0000-000000000000"}' || true)"
          [[ "$status" == "401" ]] || { echo "Unauthenticated taster link returned HTTP $status"; cat /tmp/valu-link-taster-noauth || true; exit 1; }

      - name: Install Playwright without changing project dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium for staging browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run desktop/mobile and fresh-session staging browser audit
        run: node scripts/staging-browser-audit.mjs
        env:
          STAGING_SITE_URL: https://valoria-staging-site.riverwayse.workers.dev
          STAGING_ASSESSMENT_URL: https://valoria-staging-assessment.riverwayse.workers.dev
