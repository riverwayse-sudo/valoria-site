name: Validate and deploy current-site audit to isolated Cloudflare staging

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: valoria-site-staging-environment
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'deploy/staging-')) }}
    name: Test, build, deploy and smoke-test isolated staging Worker
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run unit and contract tests
        run: npm test -- --runInBand
      - name: Provide staging-only build configuration
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          NEXT_PUBLIC_SITE_URL=https://staging.valoriainstitute.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_C3j_CjLgTLDGRu8rH1SXEg_tYpxoYUm
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          ANTHROPIC_API_KEY=placeholder-anthropic-key
          VALU_ASSESSMENT_ORIGIN=https://assessment-staging.valoriainstitute.com
          VALU_UPSTREAM_ORIGIN=https://assessment-staging.valoriainstitute.com
          VALU_PREVIEW_ASSESSMENT_ORIGIN=https://assessment-staging.valoriainstitute.com
          NEXT_PUBLIC_VALU_ASSESSMENT_ORIGIN=https://assessment-staging.valoriainstitute.com
          CF_WORKERS_PREVIEW=1
          VALU_PREVIEW=1
          NEXT_PUBLIC_VALU_PREVIEW=1
          VALU_STAGING_API_ENABLED=1
          NEXT_PUBLIC_VALU_STAGING_API_ENABLED=1
          EOF
      - name: Install pinned Cloudflare build tools
        run: npm install --no-save @opennextjs/cloudflare@1.20.15 wrangler@4.156.1
      - name: Build OpenNext output
        run: npx @opennextjs/cloudflare build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Deploy only the isolated staging Worker
        run: npx wrangler deploy --config wrangler.jsonc --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test staging routes and privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://staging.valoriainstitute.com"
          routes=(
            /
            /valu
            /valu/start
            /valu/register
            /valu/assessment
            /prime
            /about-us
            /atb-connect
            /atb-spotlight
            /develop
            /careers
            /contact-us
            /login
            /professional-signup
            /dashboard
            /marketplace
            /marketplace/talent
            /marketplace/speakers
            /marketplace/facilitators
            /events
            /privacypolicy
            /terms-of-use
            /robots.txt
            /sitemap.xml
          )
          for route in "${routes[@]}"; do
            status="$(curl -sSL --retry 4 --retry-all-errors --max-time 25 -o /tmp/valoria-route-response -w '%{http_code}' "$base$route" || true)"
            if [[ "$status" != "200" ]]; then
              echo "Route $route returned HTTP $status"
              cat /tmp/valoria-route-response || true
              exit 1
            fi
          done

          curl -fsS "$base/robots.txt" -o /tmp/valoria-robots.txt
          grep -Eq '^Disallow: /$' /tmp/valoria-robots.txt
          curl -fsS "$base/sitemap.xml" -o /tmp/valoria-sitemap.xml
          grep -q '<loc>https://staging.valoriainstitute.com/' /tmp/valoria-sitemap.xml
          if grep -Eq '<loc>https://(www\.)?valoriainstitute\.com/' /tmp/valoria-sitemap.xml; then
            echo "Staging sitemap must not publish production canonical URLs"
            exit 1
          fi
          curl -fsS "$base/" -o /tmp/valoria-home.html
          grep -q 'Capability should decide' /tmp/valoria-home.html
          grep -q 'Valoria sets the standard.' /tmp/valoria-home.html
          grep -q 'START THE VALU INDEX TASTER' /tmp/valoria-home.html
          grep -q 'THE VALORIA MARKETPLACE' /tmp/valoria-home.html
          grep -q 'Find professionals' /tmp/valoria-home.html
          grep -q 'POINTS-BASED CAPABILITY PROFILE' /tmp/valoria-home.html
          if grep -Eiq '(WANT TO BE DISCOVERED|Become discoverable|Build a professional profile that helps relevant decision-makers understand your capabilities|buyer access|sourcing access|BASIC LISTING|FULL LISTING|1 of 58|1 of 9|54 scored questions|four validity checks|nine questions|58 questions|55 questions|84 / 100|[0-9]+[[:space:]]*/[[:space:]]*100)' /tmp/valoria-home.html; then
            echo "Homepage exposes internal access or assessment mechanics"
            exit 1
          fi

          bootstrap_status="$(curl -sS -o /tmp/valu-bootstrap-response -w '%{http_code}' -X POST "$base/api/valu-taster/bootstrap" -H 'Content-Type: application/json' --data '{}')"
          if [[ "$bootstrap_status" != "401" ]]; then
            echo "Unauthenticated Taster bootstrap returned HTTP $bootstrap_status; expected 401."
            cat /tmp/valu-bootstrap-response || true
            exit 1
          fi
          grep -q 'Create or sign in to your Valoria account' /tmp/valu-bootstrap-response

          echo "Unauthenticated Taster bootstrap correctly rejects access; browser audit covers the public entry surfaces."

      - name: Install Playwright without changing project dependencies
        run: npm install --no-save --package-lock=false playwright@1.65.0
      - name: Install Chromium for staging browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run desktop/mobile and fresh-session staging browser audit
        run: node scripts/staging-browser-audit.mjs
      - name: Upload staging browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-staging-browser-audit
          path: artifacts/staging-browser-audit/
          if-no-files-found: warn
          retention-days: 7
        env:
          STAGING_SITE_URL: https://staging.valoriainstitute.com
          STAGING_ASSESSMENT_URL: https://assessment-staging.valoriainstitute.com
