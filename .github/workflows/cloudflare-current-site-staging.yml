name: Validate and deploy current-site audit to isolated Cloudflare staging

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-current-site-staging.yml"

permissions:
  contents: read

jobs:
  deploy-staging:
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'deploy/staging-')) }}
    concurrency:
      group: valoria-site-staging-environment
      cancel-in-progress: true
    name: Test, build, deploy and smoke-test isolated staging Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run unit and contract tests
        run: npm test -- --runInBand
      - name: Provide staging-only build configuration
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          NEXT_PUBLIC_SITE_URL=https://staging.valoriainstitute.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_C3j_CjLgTLDGRu8rH1SXEg_tYpxoYUm
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          ANTHROPIC_API_KEY=placeholder-anthropic-key
          VALU_ASSESSMENT_ORIGIN=https://assessment-staging.valoriainstitute.com
          VALU_UPSTREAM_ORIGIN=https://assessment-staging.valoriainstitute.com
          VALU_PREVIEW_ASSESSMENT_ORIGIN=https://assessment-staging.valoriainstitute.com
          NEXT_PUBLIC_VALU_ASSESSMENT_ORIGIN=https://assessment-staging.valoriainstitute.com
          CF_WORKERS_PREVIEW=1
          VALU_PREVIEW=1
          NEXT_PUBLIC_VALU_PREVIEW=1
          VALU_STAGING_API_ENABLED=1
          NEXT_PUBLIC_VALU_STAGING_API_ENABLED=1
          EOF
      - name: Install pinned Cloudflare build tools
        run: npm install --no-save @opennextjs/cloudflare@1.20.15 wrangler@4.156.1
      - name: Build OpenNext output
        run: npx @opennextjs/cloudflare build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Deploy only the isolated staging Worker
        run: npx wrangler deploy --config wrangler.jsonc --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test staging routes and privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-smoke
          exec > >(tee -a artifacts/staging-smoke/smoke.log) 2>&1
          set -x
          base="https://staging.valoriainstitute.com"
          routes=(
            /
            /valu
            /valu/start
            /valu/register
            /valu/assessment
            /prime
            /about-us
            /atb-connect
            /atb-spotlight
            /develop
            /careers
            /contact-us
            /login
            /professional-signup
            /dashboard
            /marketplace
            /marketplace/talent
            /marketplace/speakers
            /marketplace/facilitators
            /events
            /privacypolicy
            /terms-of-use
            /robots.txt
            /sitemap.xml
          )
          for route in "${routes[@]}"; do
            status="$(curl -sSL --retry 4 --retry-all-errors --max-time 25 -o /tmp/valoria-route-response -w '%{http_code}' "$base$route" || true)"
            echo "CHECK route=$route status=$status"
            if [[ "$status" != "200" ]]; then
              echo "Route $route returned HTTP $status"
              cat /tmp/valoria-route-response || true
              exit 1
            fi
          done
          echo "PASS: all public, dashboard and policy routes return HTTP 200."

          curl -fsS "$base/robots.txt" -o /tmp/valoria-robots.txt
          cat /tmp/valoria-robots.txt | tee artifacts/staging-smoke/robots.txt
          grep -Eq '^Disallow: /
          # The assessment Worker owns Taster-first session APIs; its CORS, persistence,
          # completion and retry behavior are validated by the platform staging workflow.
          # Participant-visible navigation and fresh-session behavior are checked by Playwright.

      - name: Upload staging smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-staging-smoke-diagnostics
          path: artifacts/staging-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Install Playwright without changing project dependencies
        run: npm install --no-save --package-lock=false playwright@1.65.0
      - name: Install Chromium for staging browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run desktop/mobile and fresh-session staging browser audit
        run: node scripts/staging-browser-audit.mjs
      - name: Upload staging browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-staging-browser-audit
          path: artifacts/staging-browser-audit/
          if-no-files-found: warn
          retention-days: 7
        env:
          STAGING_SITE_URL: https://staging.valoriainstitute.com
          STAGING_ASSESSMENT_URL: https://assessment-staging.valoriainstitute.com
 /tmp/valoria-robots.txt
          echo "PASS: staging robots policy blocks indexing."
          curl -fsS "$base/sitemap.xml" -o /tmp/valoria-sitemap.xml
          cp /tmp/valoria-sitemap.xml artifacts/staging-smoke/sitemap.xml
          grep -q '<loc>https://staging.valoriainstitute.com/' /tmp/valoria-sitemap.xml
          if grep -Eq '<loc>https://(www\.)?valoriainstitute\.com/' /tmp/valoria-sitemap.xml; then
            echo "Staging sitemap must not publish production canonical URLs"
            grep -n 'valoriainstitute.com' /tmp/valoria-sitemap.xml | head -50
            exit 1
          fi
          echo "PASS: staging sitemap contains only staging canonical URLs."
          curl -fsS "$base/" -o /tmp/valoria-home.html
          cp /tmp/valoria-home.html artifacts/staging-smoke/homepage.html
          for phrase in 'Capability should decide' 'Capability deserves' 'START THE VALU INDEX TASTER' 'href="/valu/assessment/"' 'THE VALORIA MARKETPLACE' 'Find professionals' 'POINTS-BASED CAPABILITY PROFILE'; do
            if grep -Fq "$phrase" /tmp/valoria-home.html; then
              echo "PASS: homepage contains $phrase"
            else
              echo "FAIL: homepage missing $phrase"
              grep -oE '.{0,100}(Capability|VALU|Marketplace|professionals|POINTS).{0,120}' /tmp/valoria-home.html | head -50 || true
              exit 1
            fi
          done
          echo "PASS: homepage exposes the canonical Taster-first entry."
          # The assessment Worker owns Taster-first session APIs; its CORS, persistence,
          # completion and retry behavior are validated by the platform staging workflow.
          # Participant-visible navigation and fresh-session behavior are checked by Playwright.

      - name: Install Playwright without changing project dependencies
        run: npm install --no-save --package-lock=false playwright@1.65.0
      - name: Install Chromium for staging browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run desktop/mobile and fresh-session staging browser audit
        run: node scripts/staging-browser-audit.mjs
      - name: Upload staging browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-staging-browser-audit
          path: artifacts/staging-browser-audit/
          if-no-files-found: warn
          retention-days: 7
        env:
          STAGING_SITE_URL: https://staging.valoriainstitute.com
          STAGING_ASSESSMENT_URL: https://assessment-staging.valoriainstitute.com
