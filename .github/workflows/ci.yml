# .github/workflows/ci.yml
# Valoria site CI: dependency integrity, tests, production build and secret hygiene.

name: Valoria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm install is intentional here because the repository currently has
      # dependency declarations ahead of its lockfile. It reconciles the lock
      # before tests instead of failing before the test suite can run.
      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
        env:
          CI: true

  build-check:
    name: Production Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create .env for build
        run: |
          echo "VITE_SUPABASE_URL=https://placeholder.supabase.co" >> .env
          echo "VITE_SUPABASE_ANON_KEY=placeholder_key" >> .env
          echo "NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder_key" >> .env

      - name: Run production build
        run: npm run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-parity:
    name: Env Var Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .env.example exists
        run: |
          if [ ! -f .env.example ]; then
            echo "ERROR: .env.example is missing. Create it so CI can verify env var parity."
            exit 1
          fi
          echo ".env.example found ✓"

      - name: Verify no .env file committed
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file is committed to the repo. Remove it immediately."
            exit 1
          fi
          echo "No .env committed ✓"

      - name: Check required env keys present in .env.example
        run: |
          REQUIRED_PLATFORM="VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY"
          REQUIRED_SITE="NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY ANTHROPIC_API_KEY"

          if grep -q '"next"' package.json 2>/dev/null; then
            REQUIRED="$REQUIRED_SITE"
            echo "Detected: valoria-site (Next.js)"
          else
            REQUIRED="$REQUIRED_PLATFORM"
            echo "Detected: valoria-platform (Vite)"
          fi

          for KEY in $REQUIRED; do
            if ! grep -q "$KEY" .env.example; then
              echo "ERROR: $KEY is missing from .env.example"
              exit 1
            fi
            echo "$KEY found in .env.example ✓"
          done
