# Valoria site CI: dependency integrity, tests, production build and secret hygiene.
name: Valoria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate patched Next.js lock candidate
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.dependencies.next='15.5.28'; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"
          npm install --package-lock-only --ignore-scripts
          npm update --package-lock-only --ignore-scripts baseline-browser-mapping brace-expansion browserslist js-yaml nanoid source-map-js postcss
      - name: Upload patched Next.js candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-next-patch-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: warn
      - name: Install patched dependency lock
        run: npm ci
      - name: Generate dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log('Dependency audit:', JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log(name + ': ' + item.severity + '; fix=' + JSON.stringify(item.fixAvailable));"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dependency-audit-${{ github.run_id }}
          path: npm-audit.json
          if-no-files-found: warn
      - name: Run excellence and profile regression guards
        run: npm run excellence:check
      - name: Lint critical profile routes for undefined identifiers
        run: >-
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,node,es2021
          --parser-options '{"ecmaVersion":"latest","sourceType":"module","ecmaFeatures":{"jsx":true}}'
          --rule 'no-undef:error'
          'src/app/profile/[id]/page.jsx' 'src/app/profile/[id]/ProfileClient.jsx'
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Commit patched dependency manifests to this PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/valu-bridge-continuity-screen'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: patch vulnerable site dependencies"
            git push origin "HEAD:${BRANCH}"
          fi
        env:
          CI: true

  build-check:
    name: Production Build Check
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Create CI build environment
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder_key
          SUPABASE_SERVICE_ROLE_KEY=placeholder_service_role_key
          ANTHROPIC_API_KEY=placeholder_anthropic_key
          EOF
      - name: Run production build
        run: npm run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-parity:
    name: Env Var Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .env.example exists
        run: |
          test -f .env.example
          echo ".env.example found ✓"
      - name: Verify no .env file committed
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env file is committed to the repo. Remove it immediately."
            exit 1
          fi
          echo "No .env committed ✓"
      - name: Check required env keys present in .env.example
        run: |
          REQUIRED="NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY ANTHROPIC_API_KEY"
          for KEY in $REQUIRED; do
            grep -q "^$KEY=" .env.example || { echo "ERROR: $KEY missing"; exit 1; }
            echo "$KEY found ✓"
          done
