name: Deploy approved Valoria site PR to isolated Cloudflare staging

on:
  pull_request:
    branches: ["experience/staging-redesign-20261106"]
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "next.config.js"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-staging-pr-deploy.yml"
      - "scripts/staging-browser-audit.mjs"

permissions:
  contents: read

concurrency:
  group: valoria-site-staging-environment
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'deploy/staging-') }}
    name: Test, build, deploy and smoke-test isolated staging Worker
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run Jest contract tests
        run: npm test -- --runInBand
      - name: Run opportunity validation tests
        run: npm run test:opportunity-validation
      - name: Provide CI-only staging build configuration
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          SUPABASE_URL=https://yccxgjdqworgcbircnvn.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_C3j_CjLgTLDGRu8rH1SXEg_tYpxoYUm
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          ANTHROPIC_API_KEY=placeholder-anthropic-key
          VALU_UPSTREAM_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          VALU_PREVIEW_ASSESSMENT_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          NEXT_PUBLIC_VALU_ASSESSMENT_ORIGIN=https://valoria-staging-assessment.riverwayse.workers.dev
          CF_WORKERS_PREVIEW=1
          VALU_PREVIEW=1
          NEXT_PUBLIC_VALU_PREVIEW=1
          VALU_STAGING_API_ENABLED=0
          NEXT_PUBLIC_VALU_STAGING_API_ENABLED=0
          EOF
      - name: Install pinned Cloudflare build tools
        run: npm install --no-save @opennextjs/cloudflare@1.20.15 wrangler@4.156.1
      - name: Build OpenNext output
        run: npx @opennextjs/cloudflare build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Deploy only the isolated staging Worker
        run: npx wrangler deploy --config wrangler.jsonc --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test staging routes and SEO endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://valoria-staging-site.riverwayse.workers.dev"
          routes=(
            /
            /valu
            /valu/start
            /valu/assessment
            /prime
            /about-us
            /atb-connect
            /atb-spotlight
            /develop
            /careers
            /contact-us
            /login
            /professional-signup
            /dashboard
            /marketplace
            /marketplace/talent
            /marketplace/speakers
            /marketplace/facilitators
            /jobs
            /opportunities
            /opportunities/submit
            /events
            /privacy
            /terms
            /privacypolicy
            /terms-of-use
            /knowledge
            /knowledge/valu-index
            /knowledge/prime-framework
            /knowledge/professional-capability
            /robots.txt
            /sitemap.xml
            /llms.txt
          )
          for route in "${routes[@]}"; do
            status="$(curl -sSL --retry 4 --retry-all-errors --max-time 25 -o /tmp/valoria-route-response -w '%{http_code}' "$base$route" || true)"
            if [[ "$status" != "200" ]]; then
              echo "Route $route returned HTTP $status"
              cat /tmp/valoria-route-response || true
              exit 1
            fi
          done

          curl -fsS "$base/robots.txt" -o /tmp/valoria-robots.txt
          grep -Eq '^Disallow: /$' /tmp/valoria-robots.txt
          curl -fsS "$base/sitemap.xml" -o /tmp/valoria-sitemap.xml
          grep -q 'staging.valoriainstitute.com' /tmp/valoria-sitemap.xml
          grep -q '/knowledge/prime-framework' /tmp/valoria-sitemap.xml
          grep -q '/jobs' /tmp/valoria-sitemap.xml
          curl -fsS "$base/llms.txt" -o /tmp/valoria-llms.txt
          grep -q 'proprietary five-cluster capability framework' /tmp/valoria-llms.txt
          curl -fsS "$base/prime" -o /tmp/valoria-prime.html
          if grep -Eiq '17 skills|Human-AI Collaboration|AI Fluency|[0-9]+[–-][0-9]+ POINTS|below 35 points' /tmp/valoria-prime.html; then
            echo 'Proprietary PRIME skill or scoring detail leaked into the public PRIME page'
            exit 1
          fi
          if grep -Eiq '17 skills|Human-AI Collaboration|AI Fluency|[0-9]+[–-][0-9]+ POINTS|below 35 points|0–100 point scale' /tmp/valoria-llms.txt; then
            echo 'Proprietary PRIME skill or scoring detail leaked into public llms.txt'
            exit 1
          fi
          grep -q 'Public profiles appear only when the professional has chosen visibility' /tmp/valoria-llms.txt
          if grep -Eiq 'buyer|buyers|Basic is a marketplace access state|one account' /tmp/valoria-llms.txt; then
            echo 'Internal buyer/access or account-model language leaked into public llms.txt'
            exit 1
          fi
          curl -fsS "$base/" -o /tmp/valoria-home.html
          grep -q 'Make your' /tmp/valoria-home.html
          grep -q 'BUILT FOR A GLOBAL PROFESSIONAL LANDSCAPE' /tmp/valoria-home.html
          grep -q 'Take the taster' /tmp/valoria-home.html
          grep -q 'Complete the full assessment' /tmp/valoria-home.html
          grep -q 'Become discoverable' /tmp/valoria-home.html
          : > /tmp/valoria-css-bundle.css
          css_assets="$(grep -oE 'href="[^"]+\.css[^"]*"' /tmp/valoria-home.html | cut -d '"' -f 2)"
          if [[ -z "$css_assets" ]]; then
            echo "No compiled CSS assets found in homepage HTML"
            exit 1
          fi
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            if [[ "$asset" =~ ^https?:// ]]; then css_url="$asset"; else css_url="$base$asset"; fi
            curl -fsSL --retry 4 --retry-all-errors --max-time 25 "$css_url" >> /tmp/valoria-css-bundle.css
          done <<< "$css_assets"
          grep -Fq '.vi-nav .nav-dropdown' /tmp/valoria-css-bundle.css
          grep -Fq '.nav-mobile .nav-dropdown' /tmp/valoria-css-bundle.css
          grep -Fq 'text-align:left!important' /tmp/valoria-css-bundle.css

          status="$(curl -sS -o /tmp/valu-handoff-noauth -w '%{http_code}' "$base/api/valu-handoff")"
          [[ "$status" == "401" ]] || { echo "Unauthenticated VALU handoff returned HTTP $status"; cat /tmp/valu-handoff-noauth || true; exit 1; }
          status="$(curl -sS -o /tmp/valu-link-taster-noauth -w '%{http_code}' -X POST "$base/api/link-taster" -H 'Content-Type: application/json' -d '{}')"
          [[ "$status" == "401" ]] || { echo "Unauthenticated taster link returned HTTP $status"; cat /tmp/valu-link-taster-noauth || true; exit 1; }
          status="$(curl -sS -o /tmp/valu-opportunities-disabled -w '%{http_code}' "$base/api/opportunities")"
          [[ "$status" == "503" ]] || { echo "Read-only staging opportunity API returned HTTP $status"; cat /tmp/valu-opportunities-disabled || true; exit 1; }

      - name: Install Playwright without changing project dependencies
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium for staging browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile staging browser UX audit
        run: node scripts/staging-browser-audit.mjs
        env:
          STAGING_SITE_URL: https://valoria-staging-site.riverwayse.workers.dev
          STAGING_ASSESSMENT_URL: https://valoria-staging-assessment.riverwayse.workers.dev
      - name: Upload staging browser screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-redesign-staging-browser-audit
          path: artifacts/staging-browser-audit/
          if-no-files-found: warn
          retention-days: 7
