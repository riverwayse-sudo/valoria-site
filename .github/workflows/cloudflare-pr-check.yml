name: Cloudflare PR validation

on:
  pull_request:
    branches: [migration/cloudflare-opennext]
    paths:
      - "src/**"
      - "public/**"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "open-next.config.ts"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: cloudflare-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run design and implementation checks
        run: |
          npm run design:check
          npm run excellence:check
      - name: Run regression tests
        run: npm test -- --runInBand
        env:
          CI: "true"
      - name: Build Cloudflare OpenNext bundle
        run: npx opennextjs-cloudflare build
        env:
          CI: "true"
          CF_WORKERS: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          ANTHROPIC_API_KEY: "placeholder-anthropic-key"
          RESEND_API_KEY: "placeholder-resend-key"
          VALU_UPSTREAM_ORIGIN: "https://valoria-assessment.riverwayse.workers.dev"
          CRON_SECRET: "placeholder-cron-secret"
