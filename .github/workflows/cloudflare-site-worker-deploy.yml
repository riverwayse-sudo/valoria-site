# Production deployment is explicitly authorized and content-smoke-tested.
name: Deploy Valoria site to Cloudflare production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "next.config.js"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/production-smoke.mjs"
      - ".github/workflows/cloudflare-site-worker-deploy.yml"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to authorize the production site release after staging acceptance."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: valoria-site-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'DEPLOY') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]')) }}
    name: Build, deploy and smoke-test production Cloudflare Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run unit and contract tests
        run: npm test -- --runInBand

      - name: Provide production build configuration
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://sbkgpisgkuhbalsxqkdr.supabase.co
          SUPABASE_URL=https://sbkgpisgkuhbalsxqkdr.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_qQGMH7up2CqrRH8TsEe7LQ_t2u48c6e
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          ANTHROPIC_API_KEY=placeholder-anthropic-key
          RESEND_API_KEY=placeholder-resend-key
          CRON_SECRET=placeholder-cron-secret
          VALU_UPSTREAM_ORIGIN=https://assessment.valoriainstitute.com
          NEXT_PUBLIC_VALU_ASSESSMENT_ORIGIN=https://assessment.valoriainstitute.com
          VALU_PREVIEW=0
          NEXT_PUBLIC_VALU_PREVIEW=0
          VALU_STAGING_API_ENABLED=0
          NEXT_PUBLIC_VALU_STAGING_API_ENABLED=0
          CF_WORKERS=1
          EOF

      - name: Install pinned Cloudflare build tools
        run: npm install --no-save @opennextjs/cloudflare@1.20.15 wrangler@4.156.1

      - name: Build OpenNext output
        run: npx @opennextjs/cloudflare build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1ac6d89c2eeba85a5390422d6fe97613

      - name: Smoke-test production routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://valoriainstitute.com"
          routes=(/ /valu /valu/start /signup /prime /about-us /marketplace /marketplace/talent /marketplace/speakers /marketplace/facilitators /profile/ATB-C-TAA-00177 /careers /events /privacypolicy /terms-of-use /robots.txt /sitemap.xml)
          for route in "${routes[@]}"; do
            status="$(curl -sSL --retry 4 --retry-all-errors --max-time 25 -o /tmp/valoria-production-response -w '%{http_code}' "$base$route" || true)"
            if [[ "$status" != "200" ]]; then
              echo "Production route $route returned HTTP $status"
              cat /tmp/valoria-production-response || true
              exit 1
            fi
          done

      - name: Verify approved homepage copy and retired claims
        run: node scripts/production-smoke.mjs
