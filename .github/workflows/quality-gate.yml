name: Valoria Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test -- --runInBand
      - run: npm run build

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: unit-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/production-smoke.mjs
