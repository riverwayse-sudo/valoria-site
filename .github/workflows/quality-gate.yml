name: Valoria Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: valoria-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and regression tests
        run: npm test -- --runInBand
      - name: Check design constitution
        run: npm run design:check
      - name: Check engineering excellence controls
        run: npm run excellence:check
      - name: Build production application
        run: npm run build

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: unit-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke-test deployed production routes and API boundaries
        run: node scripts/production-smoke.mjs
