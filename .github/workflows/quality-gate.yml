name: Valoria Quality Gate

on:
  push:
    branches: [main, 'experience/staging-redesign-20261106']
  pull_request:
    branches: [main]

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Install pinned OpenNext Cloudflare bindings package
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.15
      - run: npm test -- --runInBand
      - run: npm run test:opportunity-validation
      - run: npm run excellence:check
      - run: npm run build

  production-smoke:
    if: github.ref == 'refs/heads/main'
    needs: unit-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/production-smoke.mjs
