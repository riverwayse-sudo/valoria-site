name: Cloudflare site Worker validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "next.config.js"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-site-worker.yml"
  push:
    branches: [main, "fix/assessment-proxy-prefix-and-api"]
    paths:
      - "src/**"
      - "next.config.js"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-site-worker.yml"

permissions:
  contents: read

jobs:
  build-and-bundle:
    name: Build and bundle the Cloudflare site Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Provide CI-only public build configuration
        run: |
          cat > .env <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
          ANTHROPIC_API_KEY=placeholder-anthropic-key
          VALU_UPSTREAM_ORIGIN=https://assessment-preview.invalid
          EOF
      - name: Install pinned Cloudflare build tools without changing the application lockfile
        run: npm install --no-save @opennextjs/cloudflare@1.20.15 wrangler@4.156.1
      - name: Build OpenNext output
        run: npx @opennextjs/cloudflare build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run
