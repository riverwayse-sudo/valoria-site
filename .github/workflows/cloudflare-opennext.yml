name: Deploy Valoria Website to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [migration/cloudflare-opennext]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-opennext.yml"

permissions:
  contents: write

concurrency:
  group: valoria-site-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate required deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALU_UPSTREAM_ORIGIN: ${{ secrets.VALU_UPSTREAM_ORIGIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VALU_UPSTREAM_ORIGIN NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY CRON_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              exit 1
            fi
          done
          node -e "const u=new URL(process.env.VALU_UPSTREAM_ORIGIN); if(u.protocol!=='https:' || !u.hostname.endsWith('.workers.dev')) { console.error('VALU_UPSTREAM_ORIGIN must be the HTTPS platform Worker workers.dev origin before production cutover'); process.exit(1) }"

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks and tests
        run: |
          npm run design:check
          npm run excellence:check
          npm test -- --runInBand
        env:
          CI: "true"

      - name: Build and deploy with OpenNext
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKERS: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VALU_UPSTREAM_ORIGIN: ${{ secrets.VALU_UPSTREAM_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
