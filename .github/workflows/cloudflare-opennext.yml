name: Deploy Valoria Website to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [migration/cloudflare-opennext]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "next.config.js"
      - "package.json"
      - "package-lock.json"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-opennext.yml"

permissions:
  contents: read

concurrency:
  group: valoria-site-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run design, excellence and regression checks
        run: |
          npm run design:check
          npm run excellence:check
          npm test -- --runInBand
        env:
          CI: "true"

      - name: Build OpenNext Worker bundle
        run: npx opennextjs-cloudflare build
        env:
          CF_WORKERS: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VALU_UPSTREAM_ORIGIN: ${{ secrets.VALU_UPSTREAM_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Validate deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALU_UPSTREAM_ORIGIN: ${{ secrets.VALU_UPSTREAM_ORIGIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VALU_UPSTREAM_ORIGIN NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY CRON_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              exit 1
            fi
          done
          node -e "const u=new URL(process.env.VALU_UPSTREAM_ORIGIN); if(u.protocol!=='https:' || !u.hostname.endsWith('.workers.dev')) { console.error('VALU_UPSTREAM_ORIGIN must be the HTTPS platform Worker workers.dev origin'); process.exit(1) }"

      - name: Deploy OpenNext Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare deploy 2>&1 | tee deploy.log
          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          if [ -z "$worker_url" ]; then
            echo "::error::OpenNext deploy completed but no workers.dev URL was printed. Retrieve it from Cloudflare Workers dashboard."
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Valoria website Worker deployed at $worker_url"

      - name: Smoke test website Worker
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "$WORKER_URL/")"
          if [ "$status" != "200" ]; then
            echo "::error::Website Worker returned HTTP $status on its root route."
            exit 1
          fi
          echo "Website Worker root route returned HTTP 200."
