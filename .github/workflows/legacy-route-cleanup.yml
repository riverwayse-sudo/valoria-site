name: Canonical route cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[autofix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace stale internal routes
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            '/atb-connect': '/marketplace/talent',
            '/atb-spotlight': '/marketplace/speakers',
            '/facilitatormarketplace': '/marketplace/facilitators',
            '${SITE_URL}/atb-connect': '${SITE_URL}/marketplace/talent',
            '${SITE_URL}/atb-spotlight': '${SITE_URL}/marketplace/speakers',
          }
          for p in Path('src').rglob('*'):
            if not p.is_file() or p.suffix not in {'.js','.jsx','.ts','.tsx'}:
              continue
            s = p.read_text(errors='ignore')
            n = s
            for a,b in replacements.items():
              n = n.replace(a,b)
            if n != s:
              p.write_text(n)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: remove stale internal marketplace routes [autofix]" || true
          git push || true
      - name: Remove temporary workflow
        run: |
          git fetch origin main
          git rm -f .github/workflows/legacy-route-cleanup.yml || true
          git commit -m "chore: remove temporary route cleanup workflow [autofix]" || true
          git push || true
