[extend]
useDefault = true

[[allowlists]]
description = "The Supabase sb_publishable key is intended for public client use; this narrowly scopes the exception to the staging workflow."
regexTarget = "match"
paths = [
  '''^\.github/workflows/cloudflare-current-site-staging\.yml$''',
]
regexes = [
  '''NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_[A-Za-z0-9_-]+''',
]
stopwords = ["sb_publishable"]
