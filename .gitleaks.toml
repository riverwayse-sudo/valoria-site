[extend]
useDefault = true

[allowlist]
description = "Ignore only the known public Supabase publishable-key line; never ignore other credentials in these files."
condition = "AND"
regexTarget = "line"
paths = [
  '''^wrangler\.jsonc$''',
  '''^\.github/workflows/cloudflare-current-site-staging\.yml$''',
]
regexes = [
  '''NEXT_PUBLIC_SUPABASE_ANON_KEY.*sb_publishable_.*''',
]
